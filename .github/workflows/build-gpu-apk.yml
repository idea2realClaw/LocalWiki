name: Build GPU APK

# Produces a Vulkan-enabled arm64 debug APK on every push to main, and publishes
# it to the "gpu-latest" pre-release so it can be downloaded without logging in.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.workbuddy/**'
  workflow_dispatch:
    inputs:
      gpu_layers:
        description: 'nGpuLayers: 99 = full Vulkan offload, 0 = CPU only'
        required: false
        default: '99'
      publish_release:
        description: 'Publish the APK to the gpu-latest release'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-gpu-apk
  cancel-in-progress: true

jobs:
  build:
    name: windows-2022 / Vulkan GPU APK
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      VULKAN_SDK_VERSION: '1.4.309.0'
      VULKAN_SDK: 'C:\VulkanSDK\1.4.309.0'
      NDK_VERSION: '27.2.12479018'
      GPU_LAYERS: ${{ inputs.gpu_layers || '99' }}

    steps:
      # The llama.cpp patch is byte-exact LF; Windows' default autocrlf=true
      # would make `git apply` fail. Set this BEFORE checkout.
      - name: Force LF line endings
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout (with llama.cpp submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # gradle.properties carries a developer-machine proxy and an absolute SDK
      # path. Strip them here instead of changing the tracked file, so local
      # builds keep working unchanged.
      - name: Strip machine-local Gradle settings
        shell: pwsh
        run: |
          $p = 'gradle.properties'
          Get-Content $p |
            Where-Object {
              $_ -notmatch '^\s*systemProp\.(http|https)\.' -and
              $_ -notmatch '^\s*android\.sdk\.dir\s*='
            } |
            Set-Content $p -Encoding utf8
          Write-Host "ANDROID_HOME=$env:ANDROID_HOME"
          Write-Host '--- gradle.properties ---'
          Get-Content $p

      - name: Install pinned NDK
        shell: pwsh
        run: |
          if (-not $env:ANDROID_HOME) { $env:ANDROID_HOME = 'C:\Android\android-sdk' }
          if (-not (Test-Path $env:ANDROID_HOME)) { throw "Android SDK not found at $env:ANDROID_HOME" }
          $sdkmanager = Join-Path $env:ANDROID_HOME 'cmdline-tools\latest\bin\sdkmanager.bat'
          if (-not (Test-Path $sdkmanager)) {
            $sdkmanager = (Get-ChildItem (Join-Path $env:ANDROID_HOME 'cmdline-tools') `
                            -Recurse -Filter sdkmanager.bat -ErrorAction Stop |
                           Select-Object -First 1).FullName
          }
          Write-Host "sdkmanager: $sdkmanager"
          @('y') * 20 | & $sdkmanager '--licenses' | Out-Null
          & $sdkmanager '--install' "ndk;$env:NDK_VERSION"
          if ($LASTEXITCODE -ne 0) { throw "sdkmanager failed with $LASTEXITCODE" }
          $ndk = Join-Path $env:ANDROID_HOME "ndk\$env:NDK_VERSION"
          if (-not (Test-Path $ndk)) { throw "NDK missing at $ndk" }
          Write-Host "NDK ready: $ndk"

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $url = "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/VulkanSDK-$env:VULKAN_SDK_VERSION-Installer.exe"
          $installer = Join-Path $env:RUNNER_TEMP 'VulkanSDK-Installer.exe'
          Write-Host "Downloading $url"
          & curl.exe -L --fail --retry 3 --retry-delay 5 -o $installer $url
          if ($LASTEXITCODE -ne 0) { throw "SDK download failed with $LASTEXITCODE" }
          Write-Host "installer bytes: $((Get-Item $installer).Length)"

          $glslc = Join-Path $env:VULKAN_SDK 'Bin\glslc.exe'
          $vkhpp = Join-Path $env:VULKAN_SDK 'Include\vulkan\vulkan.hpp'

          # copy_only=1 skips registry / PATH changes, so no elevation is needed.
          # Fall back to a full install if this installer build rejects the flag.
          $variants = @(
            @('--root', $env:VULKAN_SDK, '--accept-licenses', '--default-answer',
              '--confirm-command', 'install', 'copy_only=1'),
            @('--root', $env:VULKAN_SDK, '--accept-licenses', '--default-answer',
              '--confirm-command', 'install')
          )
          $installed = $false
          foreach ($installArgs in $variants) {
            $proc = Start-Process -FilePath $installer -ArgumentList $installArgs -Wait -PassThru
            Write-Host "installer exit code: $($proc.ExitCode)"
            if ($proc.ExitCode -eq 0 -and (Test-Path $glslc)) { $installed = $true; break }
            Write-Warning "installer variant did not produce glslc.exe; retrying"
          }
          if (-not $installed) { throw "Vulkan SDK installer failed" }

          if (-not (Test-Path $glslc)) { throw "glslc.exe missing at $glslc" }
          if (-not (Test-Path $vkhpp)) { throw "vulkan.hpp missing at $vkhpp" }
          & $glslc --version

      # The stock SDK ships SPIRV-HeadersConfig.cmake flat in Lib/cmake with a
      # relative include prefix that resolves to the wrong directory. Gradle
      # points at Lib/cmake/SPIRV-Headers, so stage a corrected copy there.
      - name: Fix SPIRV-Headers CMake config
        shell: pwsh
        run: |
          $cmakeDir = Join-Path $env:VULKAN_SDK 'Lib\cmake'
          $subDir   = Join-Path $cmakeDir 'SPIRV-Headers'
          $cfg      = Join-Path $subDir 'SPIRV-HeadersConfig.cmake'
          if (-not (Test-Path $cfg)) {
            New-Item -ItemType Directory -Force -Path $subDir | Out-Null
            Copy-Item (Join-Path $cmakeDir 'SPIRV-HeadersConfig*.cmake') $subDir -Force
          }
          $inc  = ($env:VULKAN_SDK -replace '\\', '/') + '/Include/spirv-headers'
          $text = Get-Content $cfg -Raw
          $text = [regex]::Replace($text, 'INTERFACE_INCLUDE_DIRECTORIES\s+"[^"]*"',
                                   "INTERFACE_INCLUDE_DIRECTORIES `"$inc`"")
          $text | Set-Content $cfg -Encoding utf8
          Select-String -Path $cfg -Pattern 'INTERFACE_INCLUDE_DIRECTORIES'

      - name: Apply ggml-vulkan compatibility patch
        shell: pwsh
        run: .\scripts\apply-llama-patch.ps1

      - name: Build GPU APK
        shell: pwsh
        run: |
          # vulkan-shaders-gen is a host tool compiled with MSVC cl.exe.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath  = (& $vswhere -latest -products * -property installationPath).Trim()
          Write-Host "Visual Studio: $vsPath"
          Import-Module (Join-Path $vsPath 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vsPath -DevCmdArguments '-arch=x64' | Out-Null

          $env:PATH = "$env:VULKAN_SDK\Bin;$env:PATH"
          .\gradlew.bat assembleDebug --console=plain --no-daemon `
            "-PgpuLayers=$env:GPU_LAYERS" "-PvulkanSdk=$env:VULKAN_SDK"
          if ($LASTEXITCODE -ne 0) { throw "assembleDebug failed with $LASTEXITCODE" }

          $apk = 'app\build\outputs\apk\debug\app-debug.apk'
          if (-not (Test-Path $apk)) { throw "APK not produced at $apk" }
          Copy-Item $apk 'QwenAndroidLLM-gpu.apk' -Force
          $sha = (& git rev-parse --short HEAD).Trim()
          Copy-Item $apk "QwenAndroidLLM-gpu-$sha.apk" -Force
          $hash = (Get-FileHash 'QwenAndroidLLM-gpu.apk' -Algorithm SHA256).Hash
          Write-Host "APK bytes: $((Get-Item 'QwenAndroidLLM-gpu.apk').Length)"
          Write-Host "APK SHA256: $hash"
          "APK SHA256: $hash" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: QwenAndroidLLM-gpu-${{ github.sha }}
          path: QwenAndroidLLM-gpu*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Publish gpu-latest release
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag  = 'gpu-latest'
          $sha  = (& git rev-parse --short HEAD).Trim()
          $notes = @"
          Automated Vulkan GPU build from commit ${{ github.sha }}.

          Runner: windows-2022 | NDK $env:NDK_VERSION | Vulkan SDK $env:VULKAN_SDK_VERSION
          GPU layers: $env:GPU_LAYERS (99 = all layers offloaded to Vulkan)
          Requires a Vulkan 1.2+ device (OnePlus 13 / Adreno 830).
          Signed with the repository debug key (same as local builds).

          Install: adb install -r QwenAndroidLLM-gpu.apk
          "@
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title 'GPU APK (latest main)' `
              --notes $notes --prerelease --target $env:GITHUB_SHA
          } else {
            gh release edit $tag --notes $notes
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release failed with $LASTEXITCODE" }

          gh release upload $tag 'QwenAndroidLLM-gpu.apk' "QwenAndroidLLM-gpu-$sha.apk" --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed with $LASTEXITCODE" }

          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/QwenAndroidLLM-gpu.apk"
          Write-Host "DOWNLOAD_URL=$url"
          "**APK download:** $url" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
